name: Update Rosters

on:
  schedule:
   - cron: "0 3 * * *"   # Every morning at 3 AM
  workflow_dispatch:        # manual run option

jobs:
  update_rosters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas pyarrow nflreadpy


      - name: Run update script
        run: python3 update_rosters.py

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl.db
          git commit -m "Update NFL Rosters [skip ci]" || echo "No changes to commit"
          git push

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: BLSHEE22/revenge-game-finder
          token: ${{ secrets.DATABASE_REPO_TOKEN }}
          path: database-repo

      - name: Copy updated database
        run: |
          cp data/nfl.db database-repo/data/nfl.db

      - name: Commit and push database
        working-directory: database-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nfl.db

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update database"
          git push
