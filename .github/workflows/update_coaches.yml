name: Update Coaches

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  update_coaches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Update coach history
        run: python3 update_coaches.py
      - name: Commit and push coach data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coaches.json
          if git diff --cached --quiet; then
            echo "No coach data changes"
            exit 0
          fi
          git commit -m "Update coach data [skip ci]"
          git push
